services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # args:
      #   ENABLE_GPU_DRIVERS: "false"  # 默认已启用；设为 false 可构建不含 VA-API 驱动的精简镜像
    image: y2a-auto:local
    container_name: y2a-auto
    restart: unless-stopped
    ports:
      - "5000:5000"
    
    # 挂载目录
    volumes:
      - ./config:/app/config
      - ./db:/app/db
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./cookies:/app/cookies
      - ./temp:/app/temp

    # 环境变量配置
    environment:
      - TZ=Asia/Shanghai
      - PYTHONIOENCODING=utf-8
      # NVIDIA 用户取消下面两行及下方 `gpus: all` 的注释
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=video,utility

    # ========================================
    # GPU 硬件编码加速配置（可选）
    # 根据您的显卡类型，取消注释对应的配置部分
    # ========================================

    # --- NVIDIA GPU 配置 ---
    # 需要安装 nvidia-container-toolkit
    # 安装指南: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
    # 普通 `docker compose` 推荐配置：
    # gpus: all
    #
    # --- Intel GPU 配置 (QSV) ---
    # 需要挂载 /dev/dri；容器用户还需有宿主 video/render 设备组权限。
    # 若组名映射失败，请将下方名称替换为宿主 `getent group video/render` 返回的 GID。
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - video
    #   - render

    # --- AMD GPU 配置 (VAAPI) ---
    # 需要挂载 /dev/dri 设备
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - video
    #   - render
