name: ARM64 Docker Image Test

"on":
  workflow_dispatch:
  push:
    branches:
      - feat/multi-arch-docker

concurrency:
  group: arm64-image-test-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fqscfqj/y2a-auto

jobs:
  build-test-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 image for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: local/y2a-auto:arm64-test
          cache-from: type=gha,scope=arm64-image-test
          cache-to: type=gha,mode=max,scope=arm64-image-test

      - name: Test ARM64 image
        shell: bash
        run: |
          set -euo pipefail

          container_name="test-y2a-auto-arm64"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --rm -d --name "$container_name" -p 5001:5000 local/y2a-auto:arm64-test

          for i in $(seq 1 12); do
            if curl -sf http://localhost:5001/ >/dev/null; then
              break
            fi
            echo "Waiting for application startup... ($i/12)"
            sleep 5
          done

          curl -f http://localhost:5001/
          test "$(docker exec "$container_name" uname -m)" = "aarch64"
          docker exec "$container_name" yt-dlp --version
          docker exec "$container_name" deno --version
          docker exec "$container_name" ffmpeg -version
          docker exec "$container_name" ffprobe -version
          docker exec "$container_name" python -c "import torch, torchaudio, silero_vad, curl_cffi; print('ARM64 runtime deps OK')"
          docker exec "$container_name" sh -c "ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ARM64 test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-test-${{ github.sha }}
          cache-from: type=gha,scope=arm64-image-test
          cache-to: type=gha,mode=max,scope=arm64-image-test

      - name: Verify pushed image
        shell: bash
        env:
          TEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-test-${{ github.sha }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "$TEST_IMAGE")"
          grep -q 'linux/arm64' <<< "$manifest"
          if grep -q 'linux/amd64' <<< "$manifest"; then
            echo "Unexpected amd64 platform in ARM64-only test image"
            exit 1
          fi
          echo "ARM64 test image: $TEST_IMAGE" >> "$GITHUB_STEP_SUMMARY"
